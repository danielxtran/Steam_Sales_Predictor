[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-sales-predictor"
version = "0.1.0"
description = "Steam price tracker that collects US price history for sale predictions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "requests==2.32.5",
    "sqlalchemy==2.0.50",
    "python-dotenv==1.2.2",
    "schedule==1.2.2",
]

[project.optional-dependencies]
notebooks = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Explicit list so new ruff releases don't change what CI checks.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
